name: Build and deploy MDX Fuel to InMotion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy dist to InMotion over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.INMOTION_SFTP_USERNAME }}
          server: ${{ secrets.INMOTION_SFTP_HOST }}
          port: ${{ secrets.INMOTION_SFTP_PORT || 22 }}
          ssh_private_key: ${{ secrets.INMOTION_SFTP_PRIVATE_KEY }}
          local_path: './dist/*'
          remote_path: ${{ secrets.INMOTION_SFTP_REMOTE_PATH || '/public_html' }}
          sftp_only: true
